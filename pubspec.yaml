name: expense_tracker
description: "Beautiful expense tracker app with dark/light theme"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  fl_chart: ^0.70.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  csv: ^6.0.0
  file_picker: ^8.1.7
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/hisabify_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon/hisabify_logo.png"

flutter:
  uses-material-design: true
