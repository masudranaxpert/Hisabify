name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Hisabify.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Hisabify ${{ github.ref_name }}"
          body: |
            ## 📥 Download
            Download the APK below and install on your Android device.

            ## What's New
            - Expense & Income tracking with categories
            - Habit tracker with streaks & reminders
            - Productivity timer (Stopwatch, Countdown, Intervals)
            - Monthly budget management
            - Statistics & charts
            - Data export (CSV)
            - Dark & Light theme
          files: build/app/outputs/flutter-apk/Hisabify.apk
          draft: false
          prerelease: false
